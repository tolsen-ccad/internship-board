<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>US Game Contract Gigs</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&display=swap');
  :root{
    --bg: #1b1c34; --bg-2: #23244a; --surface: #2a2b57; --surface-hover: #33356b;
    --border: #3c3e73; --text: #e9e8f5; --text-muted: #a5a3c9; --amber: #f2b84b;
    --teal: #4fd1c5; --rose: #ef7a9a; --purple: #9f7aea;
  }
  html{ scroll-behavior: smooth; } *{ box-sizing: border-box; }
  body{
    margin:0; background: radial-gradient(circle at 20% 0%, var(--bg-2), var(--bg) 60%);
    color: var(--text); font-family: 'Space Grotesk', sans-serif; padding: 28px 20px 60px; min-height: 100vh;
  }
  .wrap{ max-width: 760px; margin: 0 auto; }
  header{ margin-bottom: 22px; }
  .eyebrow{ font-family: 'Press Start 2P', monospace; font-size: 9px; letter-spacing: 0.08em; color: var(--rose); margin: 0 0 10px; }
  h1{ font-family: 'Press Start 2P', monospace; font-size: 18px; line-height: 1.6; margin: 0 0 8px; color: var(--amber); }
  .sub{ color: var(--text-muted); font-size: 14px; margin: 0; }
  
  .board-nav { display: flex; gap: 12px; margin: 24px 0 12px; flex-wrap: wrap; }
  .nav-item {
    font-size: 14px; font-weight: 600; color: var(--text-muted); text-decoration: none;
    padding: 8px 16px; border-radius: 10px; background: rgba(42, 43, 87, 0.4);
    border: 1px solid var(--border); transition: all 0.15s ease; display: flex; align-items: center; gap: 6px;
  }
  .nav-item:hover { border-color: var(--teal); color: var(--text); background: var(--surface); }
  .nav-item.active { background: var(--surface); border-color: var(--amber); color: var(--amber); }

  .controls{ display:flex; gap:10px; flex-wrap:wrap; margin: 20px 0 4px; }
  .chip{ border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); font-size: 13px; padding: 7px 13px; border-radius: 999px; cursor: pointer; transition: all 0.15s ease; user-select: none; }
  .chip:hover { border-color: var(--rose); color: var(--text); }
  .chip.active{ background: var(--rose); border-color: var(--rose); color: #0c1220; font-weight: 600; }
  .search{ width:100%; margin-top: 12px; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 10px 14px; border-radius: 10px; font-family: inherit; }
  .status{ font-size: 12px; color: var(--text-muted); margin: 16px 2px 10px; }
  .feed{ display:flex; flex-direction:column; gap: 12px; }
  .card{ background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; display:flex; gap: 14px; text-decoration:none; color: inherit; transition: all 0.15s ease; }
  .card:hover{ border-color: var(--rose); transform: translateY(-1px); }
  .card-body{ flex:1; }
  .card-title{ font-size: 15px; font-weight:600; margin: 0 0 3px; }
  .card-meta{ font-size: 13px; color: var(--text-muted); margin: 0 0 8px; }
  .tags{ display:flex; gap:6px; flex-wrap:wrap; }
  .tag{ font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--bg-2); border: 1px solid var(--border); color: var(--text-muted); }
  .tag.budget { border-color: var(--rose); color: var(--rose); font-weight: 600; }
  .empty{ text-align:center; padding: 40px; color: var(--text-muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">// PORTFOLIO VALUE BOOSTER</p>
    <h1>CONTRACT WORK &amp; COMMISSION GIGS</h1>
    <p class="sub">Short-term work modules, outsourcing opportunities, and freelance asset creation.</p>
    
    <nav class="board-nav">
      <a href="index.html" class="nav-item">⚔ Internships &amp; Entry-level</a>
      <a href="gigs.html" class="nav-item active">💎 Contract &amp; Gigs</a>
      <a href="jams.html" class="nav-item">👾 US Game Jams</a>
    </nav>
  </header>

  <div class="controls" id="tag-filters"></div>
  <input class="search" id="search-input" type="text" placeholder="Filter active client commissions…">

  <div class="status"><span id="status-text">Loading freelance contracts...</span></div>
  <div class="feed" id="feed"></div>
</div>

<script>
let gigs = [];
let activeTag = null;

async function loadData() {
  try {
    const res = await fetch('gigs.json');
    gigs = await res.json();
    buildFilters();
    render();
  } catch (e) {
    document.getElementById('status-text').textContent = "Failed to load freelance data archive.";
  }
}

function buildFilters() {
  const tagSet = new Set();
  gigs.forEach(g => g.tags.forEach(t => tagSet.add(t)));
  const container = document.getElementById('tag-filters');
  container.innerHTML = '';
  [...tagSet].sort().forEach(tag => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = tag;
    chip.onclick = () => {
      activeTag = activeTag === tag ? null : tag;
      render();
      [...container.children].forEach(c => c.classList.toggle('active', c.textContent === activeTag));
    };
    container.appendChild(chip);
  });
}

function render() {
  const query = document.getElementById('search-input').value.toLowerCase();
  const feed = document.getElementById('feed');
  
  let filtered = gigs.filter(g => {
    const matchesTag = !activeTag || g.tags.includes(activeTag);
    const matchesText = `${g.title} ${g.client} ${g.source}`.toLowerCase().includes(query);
    return matchesTag && matchesText;
  });

  document.getElementById('status-text').textContent = `${filtered.length} Distributed Openings Listed`;
  feed.innerHTML = '';

  if(!filtered.length) {
    feed.innerHTML = '<div class="empty">No matching open contracts active.</div>';
    return;
  }

  filtered.forEach(g => {
    const card = document.createElement('a');
    card.className = 'card';
    card.href = g.url;
    card.target = '_blank';
    card.innerHTML = `
      <div class="card-body">
        <div class="card-title">${g.title}</div>
        <div class="card-meta">💼 Client: ${g.client} · 📻 Origin: ${g.source}</div>
        <div class="tags">
          <span class="tag budget">${g.budget}</span>
          ${g.tags.map(t => `<span class="tag">${t}</span>`).join('')}
        </div>
      </div>
    `;
    feed.appendChild(card);
  });
}

document.getElementById('search-input').addEventListener('input', render);
loadData();
</script>
</body>
</html>
