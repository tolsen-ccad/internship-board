name: Aggregate Game Dev Data

on:
  schedule:
    - cron: '0 */12 * * *' # Triggers every 12 hours
  workflow_dispatch:      # Allows running manually via the GitHub Dashboard

# Grant write access to push the updated JSON data back to the repo
permissions:
  contents: write

jobs:
  run-aggregators:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Aggregate Output Records
        run: |
          node fetch-jobs.js
          node fetch-gigs.js

      - name: Commit and Push Generated Data Files
        run: |
          git config --global user.name "GitHub Automated Aggregator"
          git config --global user.email "actions@github.com"
          git add jobs.json gigs.json
          
          # Only commit and push if the data actually changed, preventing empty commits
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 System Sync: Updated Jobs & Gigs Data Archives" && git push)